<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>心中數字猜測遊戲 (1-31)</title>
<style>
body { font-family: sans-serif; background: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 2px solid #e2e8f0; padding: 40px; text-align: center; max-width: 500px; width: 90%; }
h1 { color: #4f46e5; margin-bottom: 20px; font-size: 24px; }
p { color: #64748b; line-height: 1.6; }
.btn { background-color: #4f46e5; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; }
.btn:hover { background-color: #4338ca; }
.btn-yes { background-color: #10b981; }
.btn-yes:hover { background-color: #059669; }
.btn-no { background-color: #ef4444; }
.btn-no:hover { background-color: #dc2626; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0; background: #f1f5f9; padding: 15px; border-radius: 8px; }
.grid-item { background: white; padding: 8px; border-radius: 4px; font-weight: bold; border: 1px solid #e2e8f0; }
.hidden { display: none !important; }
.result { font-size: 64px; font-weight: 800; color: #4f46e5; margin: 20px 0; }
</style>
</head>
<body>
<div class="card" id="start-screen">
<h1>🔮 心中數字猜測遊戲 (1-31)</h1>
<p>請先在心中想一個介於 <b>1 到 31</b> 之間的數字。記住它，然後點擊下方按鈕開始！</p>
<button class="btn" onclick="startGame()">開始遊戲！</button>
</div>
<div class="card hidden" id="game-screen">
<div id="step-text" style="font-weight: bold; color: #94a3b8;">卡牌 1 / 5</div>
<p>您心中想的數字有在下面嗎？</p>
<div id="number-grid" class="grid"></div>
<button class="btn btn-yes" onclick="handleAnswer(true)">有，裡面有</button>
<button class="btn btn-no" onclick="handleAnswer(false)">沒有</button>
</div>
<div class="card hidden" id="result-screen">
<h1>🔮 讀心成功！</h1>
<p>您剛剛在心中想的數字是：</p>
<div id="final-result" class="result">0</div>
<button class="btn" onclick="resetGame()">再玩一次</button>
</div>
<script>
let currentStep = 0, totalScore = 0;
function generateCard(bit) {
let nums = [];
for(let i=1; i<=31; i++) { if((i >> bit) & 1) nums.push(i); }
return nums;
}
const cards = [generateCard(0), generateCard(1), generateCard(2), generateCard(3), generateCard(4)];
function startGame() {
currentStep = 0; totalScore = 0;
document.getElementById('start-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('hidden');
showCard();
}
function showCard() {
document.getElementById('step-text').innerText = "卡牌 " + (currentStep + 1) + " / 5";
let grid = document.getElementById('number-grid');
grid.innerHTML = '';
cards[currentStep].forEach(num => {
let item = document.createElement('div');
item.className = 'grid-item';
item.innerText = num;
grid.appendChild(item);
});
}
function handleAnswer(yes) {
if(yes) totalScore += Math.pow(2, currentStep);
currentStep++;
if(currentStep < 5) showCard();
else {
document.getElementById('game-screen').classList.add('hidden');
document.getElementById('result-screen').classList.remove('hidden');
document.getElementById('final-result').innerText = totalScore === 0 ? "0" : totalScore;
}
}
function resetGame() {
document.getElementById('result-screen').classList.add('hidden');
document.getElementById('start-screen').classList.remove('hidden');
}
</script>
</body>
</html>
